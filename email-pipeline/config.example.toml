# Copy to config.toml (gitignored) and adjust. The defaults work as they are.
# Relative paths are resolved against this file's folder; ~ and %VARIABLES% are expanded.
#
# Keep the inbox and jobs folders OUTSIDE the git checkout and outside OneDrive:
# they hold confidential data, and OneDrive sync can lock files mid-run.
# Keep jobs_dir short: Windows paths longer than 260 characters fail.

inbox_dir = "~/claude_pipeline/inbox"   # drag emails / files here
jobs_dir  = "~/claude_pipeline/jobs"    # one folder per item: inputs, outputs, logs
routes_dir = "routes"                   # the business processes (shared through git)

poll_seconds = 30          # how often the inbox is checked
settle_seconds = 10        # an item must be unchanged this long before pickup

# Claude Code model aliases ("haiku", "sonnet", "opus") or full model ids.
# Empty = your Claude Code default. A route can override with `model:` in its ROUTE.md.
classifier_model = "sonnet"
route_model = "opus"

confidence_threshold = 0.7 # below this, a job goes to needs_review
max_turns = 30             # safety cap per route agent run
preprocess_timeout = 300   # seconds to read one item (attachments); a stuck item fails alone

# Teams "Workflows" webhook URL (see README). The TEAMS_WEBHOOK_URL environment
# variable overrides it. It is a secret: never put it in a committed file.
teams_webhook_url = ""
