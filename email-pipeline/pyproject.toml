[project]
name = "email-pipeline"
version = "0.1.0"
description = "Folder-watching pipeline that classifies and processes actuarial emails with the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "extract-msg",
    "pyyaml",
    "pandas",
    "openpyxl",
]

[project.scripts]
email-pipeline = "pipeline.main:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
